<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <title>MOKEPON</title>
    <script src="./js/mokepon.js"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="body">
    <section id="seleccionar-mascota">
        <h1 class="titulo">MOKEPON</h1>
        <h2 class="subtitulo">Elige tu mascota:</h2>
        <div class="tarjetas">
            <input type="radio" id="hipodoge" name="mascota" />
            <label class="tarjeta-de-mokepon" for="hipodoge">
                <p>Hipodoge</p>
                <img src="./assets/mokepons_mokepon_hipodoge_attack.webp" alt="Hipodoge" />
            </label>

            <input type="radio" id="capipepo" name="mascota" />
            <label class="tarjeta-de-mokepon" for="capipepo">
                <p>Capipepo</p>
                <img src="./assets/mokepons_mokepon_capipepo_attack.webp" alt="Capipepo" />
            </label>

            <input type="radio" id="ratigueya" name="mascota" />
            <label class="tarjeta-de-mokepon" for="ratigueya">
                <p>Ratigueya</p>
                <img src="./assets/mokepons_mokepon_ratigueya_attack.webp" alt="Ratigueya" />
            </label>
        </div>
        <div class="tarjetas">
            <input type="radio" id="langostelvis" name="mascota" />
            <label class="tarjeta-de-mokepon" for="langostelvis">
                <p>Langostelvis</p>
                <img src="./assets/mokepons_mokepon_Langostelvis_attack.png" alt="langostelvis" />
            </label>
            <input type="radio" id="tucapalma" name="mascota" />
            <label class="tarjeta-de-mokepon" for="tucapalma">
                <p>Tucapalma</p>
                <img src="./assets/mokepons_mokepon_Tucapalma_attack.png" alt="tucapalma" />
            </label>
            <input type="radio" id="pydos" name="mascota" />
            <label class="tarjeta-de-mokepon" for="pydos">
                <p>Pydos</p>
                <img src="./assets/mokepons_mokepon_pydos_attack.png" alt="pydos" />
            </label>
        </div>
        <div class="contenedor-boton">
            <button id="boton-mascotas" onclick="cambiarFondo()">Seleccionar Mascota</button>
        </div>
    </section>           
    <section id="seleccionar-ataque" style="display:none;">
        <h1><strong>Elige tu ataque</strong></h1>
        <div class="info-vidas">
            <p><strong>Tu mascota</strong> <span id="mascota-jugador">
                <img src="./assets/mokepons_mokepon_Tucapalma_attack.png" alt="Tucapalma" class="imagen-mascota">
            </span>tiene <span id="vidas-jugador"> </span> vidas</p>
            <p><strong>La mascota del enemigo</strong> <span id="mascota-enemigo">
                <img src="./assets/mokepons_mokepon_hipodoge_attack.webp" alt="Hipodge" class="imagen-mascota">
            </span>tiene <span id="vidas-enemigo"></span> vidas</p>
        </div>

        <div class="botones-ataque">
            <button id="boton-fuego" class="boton-ataque">Fuego 🔥</button>
            <button id="boton-agua" class="boton-ataque">Agua 💧</button>
            <button id="boton-tierra" class="boton-ataque">Tierra 🌍</button>
        </div>
    </section>

    <section id="mensajes"></section>
    <section id="Reiniciar">
        <button id="boton-reiniciar">Reiniciar</button>
    </section>
</body>

</html>
